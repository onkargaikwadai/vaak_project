[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parinita-vaak"
version = "2.1.0"
description = "Parinita Vaak Voice Model, realtime presence, proof and AI Studio platform"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "websockets>=13",
  "numpy>=1.26"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
qwen = ["qwen-tts", "torch", "soundfile"]
local-asr = ["faster-whisper>=1.1"]

[project.scripts]
vaak-server = "vaak.server:main"
vaak-admin = "vaak.admin:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vaak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
